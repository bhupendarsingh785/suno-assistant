<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Suno Live — baat karo</title>
<style>
  :root{--bg:#0b0f19;--panel:#151c2c;--line:#243049;--txt:#eef2fb;--dim:#93a0bd;--green:#34d399;--red:#f87171;--violet:#6d5efc;--cyan:#22d3ee}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;background:radial-gradient(120% 70% at 50% -10%,#1b1f4a 0%,var(--bg) 45%,#070a12 100%);
       color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
       display:flex;flex-direction:column;align-items:center;padding:14px 16px 26px}
  h1{font-size:17px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:12.5px;margin:0 0 12px;text-align:center}

  .mic{width:150px;height:150px;border-radius:50%;border:none;cursor:pointer;font-size:44px;
       background:linear-gradient(135deg,var(--violet),#3b82f6);color:#fff;display:grid;place-items:center;
       box-shadow:0 14px 40px -12px rgba(109,94,252,.9);transition:.15s}
  .mic.on{background:linear-gradient(135deg,#f87171,#fbbf24);animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(248,113,113,.6)}70%{box-shadow:0 0 0 22px rgba(248,113,113,0)}100%{box-shadow:0 0 0 0 rgba(248,113,113,0)}}

  .state{margin:10px 0 4px;font-size:13.5px;color:var(--dim)}
  .level{width:220px;height:7px;border-radius:99px;background:#1a2432;overflow:hidden;margin-bottom:10px}
  .level i{display:block;height:100%;width:0;background:linear-gradient(90deg,#34d399,#fbbf24,#f87171);transition:width .08s}

  video{width:120px;border-radius:14px;border:1px solid var(--line);background:#000;display:none;margin-bottom:8px}
  video.on{display:block}

  .say,.reply{width:100%;max-width:520px;border-radius:14px;padding:11px 13px;font-size:14px;margin-bottom:9px}
  .say{background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.3);min-height:42px;color:var(--cyan)}
  .reply{background:var(--panel);border:1px solid var(--line);min-height:80px;font-size:15px;line-height:1.6;white-space:pre-wrap}

  .opts{width:100%;max-width:520px;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 14px}
  .opts summary{padding:12px 0;font-size:13.5px;font-weight:700;color:var(--dim);cursor:pointer}
  .opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.06);font-size:13.5px}
  select{background:#0b1119;border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:9px;font-size:13px;max-width:60%}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}
  .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>

<h1>Suno Live</h1>
<p class="sub">Ek button — camera, sunna aur bolna, sab saath. Band karne ke liye dobara dabao.</p>

<video id="cam" autoplay playsinline muted></video>
<button class="mic" id="mic">🎙️</button>
<div class="state" id="state">Dabao — main sunungi aur dekhungi</div>
<div class="level"><i id="lvl"></i></div>

<div class="say" id="heard">…</div>
<div class="reply" id="reply">Bolo, main sun rahi hoon.</div>

<div class="row">
  <button class="btn" id="lookBtn" style="display:none">👁️ Dekho</button>
  <button class="btn" id="clearBtn">Nayi baat</button>
</div>

<details class="opts">
  <summary>⚙️ Options</summary>
  <div class="opt"><span>Awaaz</span><select id="voiceSel"></select></div>
  <div class="opt"><span>Bolne ki raftaar</span><select id="rateSel">
    <option value="0.85">Dheemi</option><option value="1" selected>Normal</option><option value="1.15">Tez</option>
  </select></div>
  <div class="opt"><span>Yaaddasht</span><button class="btn" id="memClear">Saaf karo</button></div>
  <div class="opt"><span>Pichhli baatein</span><span id="memCount" style="color:var(--dim)">0</span></div>
</details>

<script src="core.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;

const S = { on:false, rec:null, timer:null, speaking:false, lastSpoken:"", stream:null, camStream:null, voices:[], rate:1, voiceName:"" };

/* ---------- awaaz ---------- */
function loadVoices(){ try{ S.voices = speechSynthesis.getVoices() || []; }catch(e){ S.voices = []; } }
loadVoices();
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { loadVoices(); fillVoices(); };

function fillVoices(){
  const sel = $("voiceSel"); if (!sel) return;
  const list = S.voices.slice().sort((a,b)=> (/^hi/i.test(a.lang||"")?0:1) - (/^hi/i.test(b.lang||"")?0:1));
  sel.innerHTML = '<option value="">Apne aap (Hindi pehle)</option>' +
    list.map(v => `<option value="${v.name}">${v.name} (${v.lang||""})</option>`).join("");
  sel.value = S.voiceName || "";
  sel.onchange = () => { S.voiceName = sel.value; speak("Namaste, ye meri awaaz hai."); };
}
setTimeout(fillVoices, 500);

function bestVoice(){
  if (!S.voices.length) loadVoices();
  if (S.voiceName){ const x = S.voices.find(v => v.name === S.voiceName); if (x) return x; }
  const hi = S.voices.filter(v => /^hi/i.test(v.lang || ""));
  if (hi.length) return hi.find(v => /google|india/i.test(v.name)) || hi[0];
  return S.voices.find(v => /^en-in/i.test(v.lang||"")) || S.voices.find(v => /^en/i.test(v.lang||"")) || S.voices[0] || null;
}

function speak(text){
  if (!text || !('speechSynthesis' in window)) return;
  S.speaking = true;
  S.lastSpoken = String(text).slice(0, 400);
  stopRec();
  try{ speechSynthesis.cancel(); }catch(e){}
  const v = bestVoice();
  const parts = String(text).replace(/\s+/g," ").match(/.{1,160}(\s|$)/g) || [text];
  parts.forEach((p, i) => {
    const u = new SpeechSynthesisUtterance(p.trim());
    u.lang = (v && v.lang) || "hi-IN";
    u.voice = v || null;
    u.rate = S.rate;
    if (i === parts.length - 1){
      u.onend = u.onerror = () => { S.speaking = false; if (S.on) setTimeout(startRec, 650); };
    }
    speechSynthesis.speak(u);
  });
  setTimeout(() => { if (S.speaking && !speechSynthesis.speaking && !speechSynthesis.pending){ S.speaking = false; if (S.on) startRec(); } }, 12000);
}

/* ---------- sunna ---------- */
function startRec(){
  if (!SR || !S.on || S.speaking) return;
  try{ if (S.rec) S.rec.stop(); }catch(e){}
  S.rec = new SR();
  S.rec.lang = "hi-IN";
  S.rec.continuous = true;
  S.rec.interimResults = true;
  S.rec.maxAlternatives = 3;
  S.rec.onstart = () => { $("state").textContent = "Sun rahi hoon…"; };
  S.rec.onresult = (ev) => {
    if (S.speaking) return;
    let finalTxt = "", interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++){
      const r = ev.results[i];
      if (r.isFinal) finalTxt += r[0].transcript + " ";
      else interim += r[0].transcript;
    }
    if (interim) $("heard").textContent = interim;
    if (!finalTxt.trim()) return;
    const said = finalTxt.trim();
    $("heard").textContent = said;
    const a = said.toLowerCase().replace(/\s+/g," ");
    const b = S.lastSpoken.toLowerCase().replace(/\s+/g," ");
    if (b && a.length > 6 && b.includes(a.slice(0, Math.min(20, a.length)))) return;
    if (said.split(/\s+/).length < 2) return;
    answer(said);
  };
  S.rec.onerror = (e) => {
    if (e && (e.error === "not-allowed" || e.error === "service-not-allowed")){
      S.on = false; paint(); $("state").textContent = "Mic ki permission nahi mili";
    }
  };
  S.rec.onend = () => { if (S.on && !S.speaking){ clearTimeout(S.timer); S.timer = setTimeout(startRec, 350); } };
  try{ S.rec.start(); }catch(e){ clearTimeout(S.timer); S.timer = setTimeout(startRec, 900); }
}
function stopRec(){
  clearTimeout(S.timer);
  try{ if (S.rec){ S.rec.onend = null; S.rec.stop(); } }catch(e){}
  S.rec = null;
}

/* ---------- mood padho ---------- */
function moodOf(t){
  const s = t.toLowerCase();
  if (/(udaas|dukhi|pareshan|tension|thak|bore|akela|rona|bura lag|mann nahi|stress|gussa)/.test(s)) return "sad";
  if (/(khush|maza|acha laga|badhiya|great|shukriya|thanks|love|pyaar|haha)/.test(s)) return "happy";
  if (/(jaldi|turant|abhi|fast|quick)/.test(s)) return "urgent";
  return "normal";
}

async function askAI(prompt){
  const base = "https://text.pollinations.ai/" + encodeURIComponent(prompt) + "?model=openai";
  const tries = [base,
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(base),
    "https://corsproxy.io/?" + encodeURIComponent(base)];
  for (const u of tries){
    try{
      const r = await fetch(u, { cache:"no-store" });
      if (!r.ok) continue;
      const t = (await r.text() || "").trim();
      if (t.length > 3) return t;
    }catch(e){}
  }
  return null;
}

async function answer(said){
  stopRec();
  $("state").textContent = "Soch rahi hoon…";
  $("reply").textContent = "…";
  const mood = moodOf(said);
  try{ if (window.SeetalCore) SeetalCore.push("chat", { who:"user", text: said }); }catch(e){}
  let past = "";
  try{ if (window.SeetalCore) past = SeetalCore.list("chat").slice(-6).map(m => (m.who === "user" ? "Swag: " : "Suno: ") + m.text).join("\n"); }catch(e){}
  const moodLine = mood === "sad" ? "Swag udaas lag raha hai — pehle feeling ko naam do, phir baat karo. Lecture mat do."
    : mood === "happy" ? "Swag khush hai — halka-fulka, mazedaar jawab do."
    : mood === "urgent" ? "Swag jaldi chahta hai — chhota, seedha jawab do."
    : "";
  const prompt = 'Tum "Suno" ho — Swag ki Hinglish voice assistant. Roman Hindi me, 2-3 chhoti line, seedha jawab. '
    + moodLine + " " + (past ? "Pichhli baat:\n" + past + "\n" : "") + 'Ab Swag ne kaha: "' + said + '"';
  const t = await askAI(prompt);
  if (t){
    $("reply").textContent = t.trim();
    try{ if (window.SeetalCore) SeetalCore.push("chat", { who:"assistant", text: t.trim().slice(0,300) }); }catch(e){}
    paintMem();
    speak(t.trim());
  } else {
    $("reply").textContent = "Jawab nahi aa paya — net check karo.";
    speak("Jawab nahi aa paya.");
  }
  $("state").textContent = S.on ? "Sun rahi hoon…" : "Dabao — main sunungi aur dekhungi";
}

/* ---------- ek button: sab saath ---------- */
function paint(){
  $("mic").classList.toggle("on", S.on);
  $("mic").textContent = S.on ? "🔴" : "🎙️";
  $("lookBtn").style.display = S.on ? "inline-block" : "none";
  $("state").textContent = S.on ? "Sun rahi hoon…" : "Dabao — main sunungi aur dekhungi";
}

$("mic").onclick = async () => {
  if (!SR){ $("state").textContent = "Is browser me voice nahi — Chrome use karo"; return; }
  S.on = !S.on;
  paint();
  if (S.on){
    try{ speechSynthesis.cancel(); }catch(e){}
    S.speaking = false;
    await startMeter();
    await camOn();
    startRec();
    $("reply").textContent = "Bolo, main sun rahi hoon.";
  } else {
    stopRec();
    try{ speechSynthesis.cancel(); }catch(e){}
    stopMeter();
    camOff();
  }
};

/* ---------- camera ---------- */
async function camOn(){
  try{
    S.camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user" } });
    $("cam").srcObject = S.camStream;
    $("cam").classList.add("on");
    return true;
  }catch(e){ return false; }
}
function camOff(){
  try{ if (S.camStream) S.camStream.getTracks().forEach(t => t.stop()); }catch(e){}
  S.camStream = null;
  $("cam").classList.remove("on");
}

$("lookBtn").onclick = async () => {
  const v = $("cam");
  if (!v.videoWidth){ $("reply").textContent = "Camera taiyaar nahi — ek second baad dabao."; return; }
  const c = document.createElement("canvas");
  c.width = 640; c.height = Math.round(640 * v.videoHeight / v.videoWidth);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  const b64 = c.toDataURL("image/jpeg", 0.6).split(",")[1];
  $("reply").textContent = "Dekh rahi hoon…";
  try{
    const key = localStorage.getItem("aiKey") || "";
    const prov = localStorage.getItem("aiProvider") || "";
    const model = localStorage.getItem("aiModel") || "gemini-2.0-flash";
    if (key && prov === "gemini"){
      const url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + encodeURIComponent(key);
      const body = JSON.stringify({ contents:[{ parts:[
        { text:"Is photo me kya dikh raha hai? Hinglish me 2 line. Koi insaan ho to uska mood batao." },
        { inline_data:{ mime_type:"image/jpeg", data:b64 } } ] }] });
      const r = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body });
      const j = await r.json();
      if (j.error) throw new Error(j.error.message);
      const t = j.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!t) throw new Error("khaali");
      $("reply").textContent = t.trim(); speak(t.trim()); return;
    }
  }catch(e){}
  try{
    const r = await fetch("https://text.pollinations.ai/openai", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ model:"openai", messages:[{ role:"user", content:[
        { type:"text", text:"Is photo me kya dikh raha hai? Hinglish me 2 line. Insaan ho to mood batao." },
        { type:"image_url", image_url:{ url:"data:image/jpeg;base64," + b64 } } ] }] })
    });
    const j = await r.json();
    const t = j.choices?.[0]?.message?.content;
    if (t && t.length > 3){ $("reply").textContent = t.trim(); speak(t.trim()); return; }
    throw new Error("no vision");
  }catch(e){
    $("reply").textContent = "Camera chal raha hai, par photo samajhne wala free AI abhi jawab nahi de raha. Settings me Gemini key daal do to main dekh kar bataungi.";
    speak("Camera chal raha hai. Dekhne ke liye abhi jawab nahi aa raha.");
  }
};

/* ---------- meter ---------- */
let actx = null, raf = null;
async function startMeter(){
  try{
    S.stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const src = actx.createMediaStreamSource(S.stream);
    const an = actx.createAnalyser(); an.fftSize = 512; src.connect(an);
    const buf = new Uint8Array(an.frequencyBinCount);
    const loop = () => {
      an.getByteFrequencyData(buf);
      let s = 0; for (let i=0;i<buf.length;i++) s += buf[i];
      $("lvl").style.width = Math.min(100, Math.round((s/buf.length)*2.4)) + "%";
      raf = requestAnimationFrame(loop);
    };
    loop();
  }catch(e){}
}
function stopMeter(){
  try{ if (raf) cancelAnimationFrame(raf); }catch(e){}
  try{ if (S.stream) S.stream.getTracks().forEach(t => t.stop()); }catch(e){}
  S.stream = null;
}

/* ---------- options ---------- */
$("rateSel").onchange = (e) => { S.rate = Number(e.target.value) || 1; speak("Theek hai, isi raftaar se bolungi."); };
$("memClear").onclick = () => { try{ SeetalCore.clear("chat"); }catch(e){} paintMem(); $("reply").textContent = "Yaaddasht saaf — nayi shuruaat."; };
function paintMem(){ try{ $("memCount").textContent = SeetalCore.list("chat").length + " baatein"; }catch(e){} }
$("clearBtn").onclick = () => { $("heard").textContent = "…"; $("reply").textContent = "Bolo, main sun rahi hoon."; };

try{ if (window.SeetalCore) SeetalCore.visit("suno-live"); }catch(e){}
paintMem();
paint();
</script>
</body>
</html>
